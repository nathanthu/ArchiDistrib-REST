openapi: 3.0.3
info:
  title: User Service API
  description: API to manage the users of the cinema.
  version: "1.0.0"
servers:
  - url: http://localhost:3203
    description: Local development server

tags:
- name: admin
  description: Secured Admin-only calls
- name: dev
  description: Operations available to regular developers

paths:
  /:
    get:
      tags:
        - dev
      summary: Service home page
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
                example: "<h1 style='color:blue'>Welcome to the User service!</h1>"

  /users:
    get:
      tags:
        - admin
      summary: Retrieve all users
      description: Only an admin user can list all the users.
      parameters:
        - name: userid
          in: query
          required: true
          description: ID of the user making the request, must be an admin
          schema:
            type: string
            example: michael_scott
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: The requester is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userid}:
    get:
      tags:
        - dev
      summary: Retrieve a user by its ID
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - dev
      summary: Create a user
      description: The ID comes from the path. A new user is never admin.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created, the new user is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - dev
      summary: Update a user
      description: Only the given fields are updated.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - dev
      summary: Delete a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deleted, the deleted user is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userid}/bookings:
    get:
      tags:
        - dev
      summary: Retrieve a user and its detailed bookings
      description: Calls the Booking service (which calls the Movie service). The bookings list is empty if the user has no booking.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User and its bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  bookings:
                    $ref: "#/components/schemas/DatesDetails"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    UserId:
      name: userid
      in: path
      required: true
      description: Unique identifier of the user
      schema:
        type: string
        example: chris_rivers

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: chris_rivers
        name:
          type: string
          example: Chris Rivers
        last_active:
          type: integer
          description: Timestamp of the last activity
          example: 1360031010
        admin:
          type: boolean
          example: false
      required:
        - id
        - name
        - last_active
        - admin

    UserInput:
      type: object
      properties:
        name:
          type: string
          example: Chris Rivers
        last_active:
          type: integer
          example: 1360031010

    Movie:
      type: object
      description: Movie as returned by the Movie service
      properties:
        id:
          type: string
          example: "267eedb8-0f5d-42d5-8f43-72426b9fb3e6"
        title:
          type: string
          example: Creed
        rating:
          type: number
          example: 8.8
        director:
          type: string
          example: Ryan Coogler

    DatesDetails:
      type: array
      description: Booked dates with the details of each movie
      items:
        type: object
        properties:
          date:
            type: string
            example: "20151201"
          movies:
            type: array
            items:
              $ref: "#/components/schemas/Movie"

    Error:
      type: object
      properties:
        error:
          type: string
          example: user not found
